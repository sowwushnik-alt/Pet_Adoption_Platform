<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title th:text="${pet.name} + ' - Анкету питомца'">Анкета</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .details-img { width: 100%; max-height: 500px; object-fit: cover; border-radius: 15px; }
        .info-card { background: white; border-radius: 15px; padding: 30px; border: none; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-5 shadow">
    <div class="container">
        <a class="navbar-brand" href="/pets/list">🐾 Назад к списку</a>
    </div>
</nav>

<div class="container">
    <div class="row g-5">
        <div class="col-md-6">
            <img th:src="${pet.imageUrl != null && !pet.imageUrl.isEmpty() ? pet.imageUrl : 'https://via.placeholder.com/600x400?text=No+Photo'}"
                 class="details-img shadow-lg" alt="Pet Photo">
        </div>

        <div class="col-md-6">
            <div class="info-card shadow-sm">
                <div class="d-flex align-items-center mb-3">
                    <h1 class="display-4 me-3" th:text="${pet.name}">Кличка</h1>
                    <span th:class="${pet.type == 'Dog' ? 'badge bg-warning text-dark' : 'badge bg-info'}"
                          th:text="${pet.type == 'Dog' ? '🐶 Собака' : '🐱 Кошка'}">Тип</span>
                </div>

                <p class="lead" th:text="${pet.description}">Здесь будет описание питомца...</p>

                <hr class="my-4">

                <div class="row text-center mb-4">
                    <div class="col-4">
                        <h6 class="text-muted small">Возраст</h6>
                        <p class="h5" th:text="${pet.age} + ' лет'"></p>
                    </div>

                    <div class="col-8" th:if="${pet.type == 'Dog'}">
                        <h6 class="text-muted small">Громкость лая</h6>
                        <p class="h5" th:text="${pet.barkVolume != null ? pet.barkVolume : 'Неизвестно'}"></p>
                    </div>

                    <div class="col-8" th:if="${pet.type == 'Cat'}">
                        <h6 class="text-muted small">Тип содержания</h6>
                        <p class="h5" th:text="${pet.isIndoor ? '🏠 Только дома' : '🌳 Улица/Дом'}"></p>
                    </div>
                </div>

                <div th:if="${pet.ownerName != null}" class="alert alert-success border-0 shadow-sm">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center">
                            <span class="fs-3 me-3">🎉</span>
                            <div>
                                <h6 class="mb-0 fw-bold">Этот питомец уже нашёл дом!</h6>
                                <p class="mb-0 small text-success">
                                    Счастливый владелец: <strong th:text="${pet.ownerName}"></strong>
                                </p>
                            </div>
                        </div>

                        <form th:action="@{/pets/unadopt}" method="post" onsubmit="return confirm('Вы уверены, что хотите отменить усыновление?')">
                            <input type="hidden" name="petId" th:value="${pet.id}">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                ❌ Убрать владельца
                            </button>
                        </form>
                    </div>
                </div>

                <div th:if="${pet.ownerName == null}" class="card bg-light border-0">
                    <div class="card-body">
                        <h5 class="card-title fw-bold mb-3">Подарить новый дом</h5>
                        <form th:action="@{/pets/adopt}" method="post">
                            <input type="hidden" name="petId" th:value="${pet.id}">

                            <div class="mb-3">
                                <label class="form-label small text-muted">Выберите будущего хозяина:</label>
                                <select name="adopterId" class="form-select border-0 shadow-sm" required>
                                    <option value="" disabled selected>-- Выберите из списка --</option>
                                    <option th:each="adopter : ${adopters}"
                                            th:value="${adopter.id}"
                                            th:text="${adopter.name}"></option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold py-2">
                                Подтвердить усыновление
                            </button>
                        </form>
                    </div>
                </div>

            </div> </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
