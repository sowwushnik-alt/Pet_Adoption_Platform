<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мир Хвостиков — Платформа усыновления</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --primary-color: #6c5ce7; --secondary-color: #a29bfe; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white; padding: 80px 0; border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px; margin-bottom: 50px;
        }
        .pet-card { border: none; border-radius: 20px; transition: all 0.3s ease; overflow: hidden; }
        .pet-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1) !important; }
        .pet-image-container { height: 220px; position: relative; }
        .pet-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .badge-custom { position: absolute; top: 15px; right: 15px; padding: 8px 15px; border-radius: 20px; font-weight: 600; backdrop-filter: blur(5px); }
        .btn-adopt { background-color: var(--primary-color); color: white; border-radius: 12px; padding: 10px; font-weight: 600; text-decoration: none; }
        .btn-adopt:hover { background-color: #5849c4; color: white; }
        footer { background: #2d3436; color: white; padding: 40px 0; margin-top: 60px; }
    </style>
</head>
<body class="bg-light">

<section class="hero-section shadow-lg">
    <div class="container text-center">
        <h1 class="display-3 fw-bold mb-3">Найди своего верного друга 🐾</h1>
        <p class="lead mb-4">Десятки хвостиков ждут своей новой любящей семьи прямо сейчас.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="#catalog" class="btn btn-light btn-lg px-5 py-3 fw-bold text-primary rounded-pill">Смотреть всех</a>
            <a href="/pets/new" class="btn btn-outline-light btn-lg px-5 py-3 fw-bold rounded-pill">+ Добавить хвостика</a>
        </div>
    </div>
</section>

<div class="container" id="catalog">
    <div class="row">
        <div class="col-lg-4 col-md-6 mb-4" th:each="pet : ${pets}">
            <div class="card h-100 shadow-sm pet-card">
                <div class="pet-image-container">
                    <span th:class="${pet.type == 'Dog' ? 'badge-custom bg-warning text-dark' : 'badge-custom bg-info text-white'}"
                          th:text="${pet.type == 'Dog' ? '🐶 Собака' : '🐱 Кошка'}"></span>
                    <img th:src="${pet.imageUrl != null && !pet.imageUrl.isEmpty() ? pet.imageUrl : 'https://via.placeholder.com/400x300?text=Ищем+фото...'}"
                         alt="Pet Photo">
                </div>

                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 class="card-title fw-bold mb-0" th:text="${pet.name}">Имя</h3>
                        <div class="text-muted fw-bold" th:text="${pet.age} + ' года/лет'">Возраст</div>
                    </div>

                    <p class="card-text text-secondary mb-4" th:text="${pet.description != null ? pet.description : 'Этот милашка очень ждет встречи с вами!'}">
                        Описание...
                    </p>

                    <div class="mt-auto">
                        <a th:href="@{/pets/{id}(id=${pet.id})}" class="btn btn-adopt w-100 d-flex align-items-center justify-content-center mb-2">
                            Узнать больше
                        </a>

                        <div class="d-flex gap-2">
                            <a th:href="@{/pets/edit/{id}(id=${pet.id})}" class="btn btn-outline-primary btn-sm flex-grow-1 d-flex align-items-center justify-content-center">
                                <span class="material-icons me-1" style="font-size: 18px;">edit</span> Изменить
                            </a>
                            <a th:href="@{/pets/delete/{id}(id=${pet.id})}"
                               class="btn btn-outline-danger btn-sm px-3"
                               onclick="return confirm('Вы уверены, что хотите удалить этого питомца?')">
                                <span class="material-icons" style="font-size: 18px;">delete</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(pets)}">
            <div class="display-1">🏚️</div>
            <h3 class="text-muted mt-3">Все хвостики уже нашли дом!</h3>
        </div>
    </div>
</div>

<footer>
    <div class="container text-center">
        <div class="mb-3">
            <span class="h4">🐾 Мир Хвостиков</span>
        </div>
        <p class="text-secondary small">© 2026 Платформа усыновления животных. Сделано с любовью.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
